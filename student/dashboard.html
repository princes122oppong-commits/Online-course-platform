<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard | CourseHub</title>
    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a class="brand" href="../index.html">CourseHub</a>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="my-courses.html">My Courses</a>
          <a href="profile.html">Profile</a>
        </nav>
        <div class="nav-actions">
          <a class="btn btn-primary" href="../index.html">Logout</a>
        </div>
      </div>
    </header>

    <main class="container main-layout">
      <aside class="sidebar">
        <h3>Student Area</h3>
        <nav>
          <a href="dashboard.html" class="active">Overview</a>
          <a href="my-courses.html">My courses</a>
          <a href="course-player.html">Course player</a>
          <a href="quiz.html">Quiz</a>
          <a href="certificates.html">Certificates</a>
          <a href="payments.html">Payments</a>
          <a href="profile.html">Profile</a>
        </nav>
      </aside>

      <section class="content-box dashboard-shell">
        <div class="dashboard-header">
          <div>
            <p class="eyebrow">Student dashboard</p>
            <h1>Welcome back, Ada</h1>
          </div>
          <span class="status-chip">Learning</span>
        </div>

        <div id="dashboardMetrics" class="metric-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px;"></div>

        <div class="dashboard-grid">
          <div class="dashboard-card">
            <div class="card-header-row">
              <h3>Quick overview</h3>
              <span class="muted">This week</span>
            </div>
            <p id="dashboardSummary" class="dashboard-summary"></p>
            <div id="dashboardQuickStats" class="mini-grid"></div>
          </div>

          <div class="dashboard-card">
            <div class="card-header-row">
              <h3>Current courses</h3>
              <a href="my-courses.html">View all</a>
            </div>
            <div id="dashboardCourses" class="list-stack"></div>
          </div>
        </div>

        <div class="dashboard-card" style="margin-top: 24px;">
          <div class="card-header-row">
            <h3>Recent activity</h3>
            <span class="muted">Updated today</span>
          </div>
          <ul id="dashboardActivity" class="activity-list"></ul>
        </div>
      </section>
    </main>

    <script src="../config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
