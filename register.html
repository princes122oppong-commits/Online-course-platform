<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | CourseHub</title>
    <link rel="stylesheet" href="css/base.css?v=2" />
    <link rel="stylesheet" href="css/login.css?v=3" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-visual">
          <div class="auth-lamp"></div>
          <div class="auth-face">
            <span class="smile"></span>
          </div>
        </div>

        <div class="auth-content">
          <div class="auth-header">
            <h1>Join the platform</h1>
            <p>Create your account and start learning</p>
          </div>

          <form id="registerForm" class="auth-form">
            <div id="authMessage" aria-live="polite"></div>

            <div class="auth-field">
              <label for="fullname">Full name</label>
              <span class="field-icon">◌</span>
              <input class="auth-input" id="fullname" type="text" placeholder="Jane Doe" />
            </div>

            <div class="auth-field">
              <label for="role">Role</label>
              <span class="field-icon">◍</span>
              <select class="auth-input" id="role">
                <option value="student">Student</option>
                <option value="tutor">Tutor</option>
              </select>
            </div>

            <div class="auth-field">
              <label for="email">Email</label>
              <span class="field-icon">◌</span>
              <input class="auth-input" id="email" type="email" placeholder="you@example.com" />
            </div>

            <div class="auth-field">
              <label for="password">Password</label>
              <span class="field-icon">◍</span>
              <input class="auth-input" id="password" type="password" placeholder="Create a strong password" />
            </div>

            <button class="auth-btn" type="submit">Create account</button>
          </form>

          <p class="auth-meta">Already have an account? <a href="login.html">Login</a></p>
          <p class="auth-meta"><a href="admin/login.html">Admin access</a></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
