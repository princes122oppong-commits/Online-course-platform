<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | CourseHub</title>
    <link rel="stylesheet" href="css/base.css?v=2" />
    <link rel="stylesheet" href="css/login.css?v=3" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-visual">
          <div class="auth-lamp"></div>
          <div class="auth-face">
            <span class="smile"></span>
          </div>
        </div>

        <div class="auth-content">
          <div class="auth-header">
            <h1>Join the platform</h1>
            <p>Create your account and start learning</p>
          </div>

          <form id="registerForm" class="auth-form">
            <div id="authMessage" aria-live="polite"></div>

            <div class="auth-field">
              <label for="fullname">Full name</label>
              <span class="field-icon">◌</span>
              <input class="auth-input" id="fullname" type="text" placeholder="Jane Doe" />
            </div>

            <div class="auth-field">
              <label for="email">Email</label>
              <span class="field-icon">◌</span>
              <input class="auth-input" id="email" type="email" placeholder="you@example.com" autocomplete="username" />
            </div>

            <div class="auth-field">
              <label for="accountType">Account type</label>
              <span class="field-icon">◆</span>
              <select class="auth-input" id="accountType">
                <option value="student">Student</option>
                <option value="tutor">Tutor</option>
              </select>
            </div>

            <div class="auth-field password-field">
              <label for="password">Password</label>
              <span class="field-icon">◍</span>
              <input class="auth-input" id="password" type="password" placeholder="Create a strong password" autocomplete="new-password" />
              <button class="password-toggle" type="button" aria-label="Show password" title="Show password">👁</button>
            </div>

            <div class="auth-field password-field">
              <label for="confirmPassword">Confirm password</label>
              <span class="field-icon">◍</span>
              <input class="auth-input" id="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password" />
              <button class="password-toggle" type="button" aria-label="Show password" title="Show password">👁</button>
            </div>

            <button class="auth-btn" type="submit">Create account</button>
          </form>

          <p class="auth-meta">Already have an account? <a href="login.html">Login</a></p>
          <p class="auth-meta"><a href="admin/login.html">Admin portal</a></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js?v=8"></script>
    <script>
      document.querySelectorAll('.password-toggle').forEach((button) => {
        button.addEventListener('click', () => {
          const input = button.closest('.password-field')?.querySelector('.auth-input');
          if (!input) return;

          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          button.textContent = isPassword ? '🙈' : '👁';
          button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
          button.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
        });
      });
    </script>
  </body>
</html>
