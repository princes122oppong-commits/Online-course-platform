<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | CourseHub</title>
    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a class="brand" href="../index.html">CourseHub</a>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="users.html">Users</a>
          <a href="courses.html">Courses</a>
        </nav>
        <div class="nav-actions">
          <a class="btn btn-primary" href="../index.html" data-logout>Logout</a>
        </div>
      </div>
    </header>

    <main class="container main-layout">
      <aside class="sidebar">
        <h3>Admin Area</h3>
        <nav>
          <a href="dashboard.html" class="active">Overview</a>
          <a href="users.html">Users</a>
          <a href="students.html">Students</a>
          <a href="tutors.html">Tutors</a>
          <a href="courses.html">Courses</a>
          <a href="payments.html">Payments</a>
          <a href="subscriptions.html">Subscriptions</a>
          <a href="withdrawals.html">Withdrawals</a>
          <a href="reports.html">Reports</a>
          <a href="settings.html">Settings</a>
        </nav>
      </aside>

      <section class="content-box dashboard-shell" data-admin-page="dashboard">
        <div id="adminMessage" aria-live="polite"></div>
        <div class="dashboard-header">
          <div>
            <p class="eyebrow">Admin dashboard</p>
            <h1>Operations overview</h1>
          </div>
          <span class="status-chip">Platform</span>
        </div>

        <div id="dashboardMetrics" class="metric-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px;"></div>

        <div class="dashboard-grid">
          <div class="dashboard-card">
            <div class="card-header-row">
              <h3>Business snapshot</h3>
              <span class="muted">Live</span>
            </div>
            <p id="dashboardSummary" class="dashboard-summary"></p>
            <div id="dashboardQuickStats" class="mini-grid"></div>
          </div>

          <div class="dashboard-card">
            <div class="card-header-row">
              <h3>Priority actions</h3>
              <a href="courses.html">Review</a>
            </div>
            <div id="dashboardCourses" class="list-stack"></div>
          </div>
        </div>

        <div class="dashboard-card" style="margin-top: 24px;">
          <div class="card-header-row">
            <h3>Recent activity</h3>
            <span class="muted">Last 24 hours</span>
          </div>
          <ul id="dashboardActivity" class="activity-list"></ul>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
