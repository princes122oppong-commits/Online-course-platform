<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | CourseHub</title>
    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/login.css?v=3" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-visual">
          <div class="auth-lamp"></div>
          <div class="auth-face">
            <span class="smile"></span>
          </div>
        </div>

        <div class="auth-content">
          <div class="auth-header">
            <h1>Admin Access.</h1>
            <p>Sign in to manage the CourseHub platform</p>
          </div>

          <form id="loginForm" class="auth-form">
            <div id="authMessage" aria-live="polite"></div>

            <div class="auth-field">
              <label for="email">Admin email</label>
              <span class="field-icon">◌</span>
              <input class="auth-input" id="email" type="email" placeholder="admin@example.com" />
            </div>

            <div class="auth-field">
              <label for="password">Password</label>
              <span class="field-icon">◍</span>
              <input class="auth-input" id="password" type="password" placeholder="••••••••" />
            </div>

            <button class="auth-btn" type="submit">Admin sign in →</button>
          </form>

          <p class="auth-meta"><a href="../login.html">Back to user login</a></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
