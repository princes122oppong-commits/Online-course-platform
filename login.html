<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | CourseHub</title>
    <link rel="stylesheet" href="css/base.css?v=2" />
    <link rel="stylesheet" href="css/login.css?v=3" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-visual">
          <div class="auth-lamp"></div>
          <div class="auth-face">
            <span class="smile"></span>
          </div>
        </div>

        <div class="auth-content">
          <div class="auth-header">
            <h1>Welcome Back.</h1>
            <p>Pull the cord to illuminate your path</p>
          </div>

          <form id="loginForm" class="auth-form">
            <div id="authMessage" aria-live="polite"></div>

            <div class="auth-field">
              <label for="email">Username</label>
              <span class="field-icon">◌</span>
              <input class="auth-input" id="email" type="email" placeholder="you@example.com" />
            </div>

            <div class="auth-field password-field">
              <label for="password">Password</label>
              <span class="field-icon">◍</span>
              <input class="auth-input" id="password" type="password" placeholder="••••••••" />
              <button class="password-toggle" type="button" aria-label="Show password" title="Show password">👁</button>
            </div>

            <button class="auth-btn" type="submit">Sign in →</button>
          </form>

          <p class="auth-meta">Need an account? <a href="register.html">Create one</a></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
    <script>
      document.querySelectorAll('.password-toggle').forEach((button) => {
        button.addEventListener('click', () => {
          const input = button.closest('.password-field')?.querySelector('.auth-input');
          if (!input) return;

          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          button.textContent = isPassword ? '🙈' : '👁';
          button.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
          button.setAttribute('title', isPassword ? 'Hide password' : 'Show password');
        });
      });
    </script>
  </body>
</html>
