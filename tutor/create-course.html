<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Course | Tutor Dashboard</title>
    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/tutor.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a class="brand" href="../index.html">CourseHub</a>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="courses.html">Courses</a>
          <a href="students.html">Students</a>
        </nav>
        <div class="nav-actions"><a class="btn btn-primary" href="../index.html">Logout</a></div>
      </div>
    </header>
    <main class="container section">
      <div class="content-box">
        <h1>Create course</h1>
        <form id="createCourseForm" class="form-grid">
          <div id="courseMessage" aria-live="polite" style="grid-column: 1 / -1;"></div>
          <div style="grid-column: 1 / -1;"><label for="courseTitle">Course title</label><input id="courseTitle" name="title" type="text" placeholder="Complete Web Development" required /></div>
          <div><label for="courseCategory">Category</label><select id="courseCategory" name="category"><option>Web Development</option><option>Design</option><option>Marketing</option><option>Business</option></select></div>
          <div><label for="courseLevel">Level</label><select id="courseLevel" name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div>
          <div><label for="coursePrice">Price</label><input id="coursePrice" name="price" type="number" min="0" step="0.01" placeholder="250" required /></div>
          <div style="grid-column: 1 / -1;"><label for="courseDescription">Description</label><textarea id="courseDescription" name="description" placeholder="Describe the course..." required></textarea></div>
          <div style="grid-column: 1 / -1;"><label>Thumbnail</label><input type="file" /></div>
          <div style="grid-column: 1 / -1;"><button class="btn btn-primary" type="submit">Submit for review</button></div>
        </form>
      </div>
    </main>
    <script src="../config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/main.js?v=8"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const form = document.querySelector('#createCourseForm');
        const message = document.querySelector('#courseMessage');
        form?.addEventListener('submit', async (event) => {
          event.preventDefault();
          const values = Object.fromEntries(new FormData(form));
          const result = await window.coursehubSession.createCourseLive(values);
          message.textContent = result.ok ? 'Course submitted for admin review.' : result.message;
          message.style.color = result.ok ? '#166534' : '#b91c1c';
          if (result.ok) form.reset();
        });
      });
    </script>
  </body>
</html>
