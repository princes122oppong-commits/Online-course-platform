<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Course | Tutor Dashboard</title>
    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/tutor.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a class="brand" href="../index.html">CourseHub</a>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="courses.html">Courses</a>
          <a href="students.html">Students</a>
        </nav>
        <div class="nav-actions"><a class="btn btn-primary" href="../index.html">Logout</a></div>
      </div>
    </header>
    <main class="container section">
      <div class="content-box">
        <h1>Create course</h1>
        <form class="form-grid">
          <div style="grid-column: 1 / -1;"><label>Course title</label><input type="text" placeholder="Complete Web Development" /></div>
          <div><label>Category</label><select><option>Web Development</option><option>Design</option><option>Marketing</option></select></div>
          <div><label>Price</label><input type="text" placeholder="GH₵250" /></div>
          <div style="grid-column: 1 / -1;"><label>Description</label><textarea placeholder="Describe the course..."></textarea></div>
          <div style="grid-column: 1 / -1;"><label>Thumbnail</label><input type="file" /></div>
          <div style="grid-column: 1 / -1;"><button class="btn btn-primary" type="button">Save Draft</button> <button class="btn btn-secondary" type="button">Publish Course</button></div>
        </form>
      </div>
    </main>
    <script src="../config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/main.js?v=8"></script>
  </body>
</html>
