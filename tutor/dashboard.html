<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutor Dashboard | CourseHub</title>
    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a class="brand" href="../index.html">CourseHub</a>
        <nav class="nav-links">
          <a href="dashboard.html">Dashboard</a>
          <a href="courses.html">Courses</a>
          <a href="students.html">Students</a>
        </nav>
        <div class="nav-actions">
          <a class="btn btn-primary" href="../index.html">Logout</a>
        </div>
      </div>
    </header>

    <main class="container main-layout">
      <aside class="sidebar">
        <h3>Tutor Area</h3>
        <nav>
          <a href="dashboard.html" class="active">Overview</a>
          <a href="courses.html">Courses</a>
          <a href="create-course.html">Create course</a>
          <a href="course-builder.html">Course builder</a>
          <a href="students.html">Students</a>
          <a href="earnings.html">Earnings</a>
          <a href="withdrawals.html">Withdrawals</a>
          <a href="analytics.html">Analytics</a>
        </nav>
      </aside>

      <section class="content-box dashboard-shell">
        <div class="dashboard-header">
          <div>
            <p class="eyebrow">Tutor dashboard</p>
            <h1>Welcome back, Kwame</h1>
          </div>
          <span class="status-chip success">Live</span>
        </div>

        <div id="dashboardMetrics" class="metric-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px;"></div>

        <div class="dashboard-grid">
          <div class="dashboard-card">
            <div class="card-header-row">
              <h3>Performance</h3>
              <span class="muted">This month</span>
            </div>
            <p id="dashboardSummary" class="dashboard-summary"></p>
            <div id="dashboardQuickStats" class="mini-grid"></div>
          </div>

          <div class="dashboard-card">
            <div class="card-header-row">
              <h3>Course health</h3>
              <a href="courses.html">Manage</a>
            </div>
            <div id="dashboardCourses" class="list-stack"></div>
          </div>
        </div>

        <div class="dashboard-card" style="margin-top: 24px;">
          <div class="card-header-row">
            <h3>Recent activity</h3>
            <span class="muted">Fresh updates</span>
          </div>
          <ul id="dashboardActivity" class="activity-list"></ul>
        </div>
      </section>
    </main>

    <script src="../js/main.js"></script>
  </body>
</html>
